apiVersion: batch/v1
kind: CronJob
metadata:
  name: event-generator-cronjob
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: event-generator
              image: event-generator:latest
              env:
                - name: DB_HOST
                  value: "postgres"
                - name: DB_PORT
                  value: "5432"
                - name: DB_NAME
                  value: "events_db"
                - name: DB_USER
                  value: "postgres"
                - name: DB_PASSWORD
                  value: "postgres"
                - name: EVENT_COUNT
                  value: "200"
          restartPolicy: OnFailure